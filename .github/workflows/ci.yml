name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ONNX Runtime (prebuilt release)
        run: ./scripts/download_onnxruntime.sh
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - name: Smoke (no model)
        run: ./build/arctag_cli --help
      - name: Model tests (tokenizer + C vs Python parity; need the HF_TOKEN repository secret)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ARCTAG_THREADS: "2"
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret not set: skipping the model download and the model tests"
            exit 0
          fi
          ./scripts/fetch_model.sh
          ctest --test-dir build --output-on-failure
