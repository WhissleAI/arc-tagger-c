name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: ONNX Runtime (prebuilt release)
        run: ./scripts/download_onnxruntime.sh
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - name: Smoke (no model)
        run: ./build/arctag_cli --help
      - name: Fetch model (needs the HF_TOKEN repository secret; skipped without it)
        if: env.HF_TOKEN != ''
        run: ./scripts/fetch_model.sh
      - name: Tests (tokenizer + C vs Python reference parity)
        if: env.HF_TOKEN != ''
        env:
          ARCTAG_THREADS: "2"
        run: ctest --test-dir build --output-on-failure
